# A conferência no GitHub a cada envio (VP-74, 16/out/2026; ligada na VP-98,
# 19/out/2026, quando o arquivo saiu de scripts/ para cá).
# De onde veio: a mesma conferência que a Vercel roda antes de publicar
# (vercel.json: npm run check). Para onde vai: a aba Actions do repositório
# mostra um x vermelho no envio que quebrar tipos, lint, testes ou o build.
name: Conferência
on: [push, pull_request]
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
